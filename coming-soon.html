<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | Frame & Preserve</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <link rel="shortcut icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <style>
        .coming-soon-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            position: relative;
            background: var(--primary);
            color: var(--warm-white);
        }
        .coming-soon-content {
            z-index: 2;
            position: relative;
        }
        .bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.2;
            z-index: 1;
        }
        .notify-form {
            max-width: 400px;
            margin: 0 auto;
        }
        .notify-form .form-control {
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(255,255,255,0.3);
            color: white;
            border-radius: 0;
            padding: 1rem 0;
        }
        .notify-form .form-control::placeholder {
            color: rgba(255,255,255,0.5);
        }
        .notify-form .form-control:focus {
            box-shadow: none;
            border-bottom-color: white;
        }
    </style>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231D1A17' stroke-width='2'><rect x='3' y='3' width='18' height='18' rx='2' ry='2'/><circle cx='8.5' cy='8.5' r='1.5'/><polyline points='21 15 16 10 5 21'/></svg>">
    <link rel="stylesheet" href="assets/css/dark-mode.css" id="theme-css">
    <link rel="stylesheet" href="assets/css/rtl.css" id="rtl-css" disabled>
</head>
<body>

    <main class="coming-soon-page">
        <img src="https://images.unsplash.com/photo-1549887552-cb1071d3e5ca?q=80&w=1600&auto=format&fit=crop" class="bg-image" alt="Studio Background">
        
        <div class="container coming-soon-content text-center">
            <div class="logo mb-5">FRAME & PRESERVE</div>
            
            <h1 class="mb-4">Something Beautiful Is Being Prepared.</h1>
            <p class="lead mb-5 text-white opacity-75 mx-auto" style="max-width: 600px;">Our new digital studio experience is currently being framed. Leave your email to be notified when we launch.</p>
            
            <form class="notify-form mb-5 d-flex gap-3">
                <input type="email" class="form-control" placeholder="Email Address" required>
                <button type="button" class="btn btn-primary" onclick="alert('Thank you. We will notify you upon launch.')">Notify</button>
            </form>
            
            <div class="d-flex justify-content-center gap-4 mt-5">
                <a href="#" class="text-white opacity-50 text-decoration-none">Instagram</a>
                <a href="#" class="text-white opacity-50 text-decoration-none">Pinterest</a>
            </div>
            
            <div class="mt-5 pt-5">
                <a href="index.html" class="eyebrow text-white opacity-75">Back to Home</a>
            </div>
        </div>
    </main>


    <!-- Scroll Top Button -->
    <button class="scroll-top" id="scrollTopBtn" aria-label="Scroll to top">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 15l-6-6-6 6"/></svg>
    </button>
</body>
</html>
